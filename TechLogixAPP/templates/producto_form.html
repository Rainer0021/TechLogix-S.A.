{% extends 'base.html' %}

{% block title %}{{ accion }} Producto - TechLogix{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border">
            <div class="card-body p-4">
                <h3 class="card-title mb-4 text-center">{{ accion }} Producto</h3>
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mt-3">Guardar</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{% url 'admin_panel' %}" class="text-decoration-none text-muted">Cancelar</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
